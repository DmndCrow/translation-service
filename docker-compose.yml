version: '3'
services:
  translation-service:
    container_name: translation_service
    restart: always
    build:
      context: .
      dockerfile: ./deployment/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/i18n}
    ports:
      - ${SERVICE_PORT}:3000
    command: npm start
    networks:
      - external_network
      - default

networks:
  external_network:
    name: ${NETWORK_NAME}
    external: true
